name: Review policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-policy:
    name: Review policy
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate latest Codex review policy
        uses: thatfactory/agent-guidelines/.github/actions/codex-review-policy@1c957669005eea010131c53f0a4146db2ccf7859
        with:
          profile: review-only
